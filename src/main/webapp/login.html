<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log in – GroceryIQ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div class="login-page">
  <main class="login-card">
    <div class="login-header">
      <div class="login-logo">🛒</div>
      <h1 class="login-title">GroceryIQ</h1>
      <p class="login-subtitle">Smart Grocery Inventory System</p>
    </div>

    <div id="loginError" class="alert alert-danger hidden" role="alert">
      <span class="alert-icon">⚠️</span>
      <span id="errorText"></span>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username"
               autocomplete="username" required autofocus/>
        <span class="form-error hidden" data-error-for="username"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"
               autocomplete="current-password" required/>
        <span class="form-error hidden" data-error-for="password"></span>
        <label class="form-hint"><input type="checkbox" id="showPwd"/> Show password</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">Sign in →</button>
    </form>

    <p class="login-hint">
      Demo: <code>admin</code> / <code>Admin@123</code> &nbsp;·&nbsp; <code>staff</code> / <code>Staff@123</code>
    </p>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
